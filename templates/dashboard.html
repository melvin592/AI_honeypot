<!DOCTYPE html>
<html>
<head>
    <title>Honeypot Dashboard</title>
    <style>
        body { font-family: Arial; background: #1e1e1e; color: white; padding: 20px; }
        h2 { color: #4fc3f7; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #333; padding: 10px; text-align: left; color: #4fc3f7; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        .prompt_injection { color: #ff5252; }
        .credential_theft { color: #ff9800; }
        .memory_poisoning { color: #ce93d8; }
        .canary_triggered { color: #ff1744; font-weight: bold; }
        .normal { color: #81c784; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-box { background: #333; padding: 15px 25px; border-radius: 8px; text-align: center; }
        .stat-box h3 { margin: 0; font-size: 2em; color: #4fc3f7; }
        .stat-box p { margin: 5px 0 0; color: #aaa; }
    </style>
    <meta http-equiv="refresh" content="5">
</head>
<body>
    <h2>🛡️ AI Honeypot Dashboard</h2>

    <div class="stats">
        <div class="stat-box">
            <h3>{{ total }}</h3>
            <p>Total Events</p>
        </div>
        <div class="stat-box">
            <h3>{{ attacks }}</h3>
            <p>Attacks</p>
        </div>
        <div class="stat-box">
            <h3>{{ canaries }}</h3>
            <p>Canaries Triggered</p>
        </div>
    </div>
    <button onclick="exportReport()" style="margin: 20px 0; padding: 10px 20px; background: #4fc3f7; color: black; border: none; border-radius: 4px; cursor: pointer;">
    Export PDF Report
</button>

    <table>
        <tr>
            <th>Time</th>
            <th>Session</th>
            <th>Action</th>
        </tr>
        {% for event in events %}
        <tr>
            <td>{{ event.time }}</td>
            <td>{{ event.session }}</td>
            <td class="{{ event.action.split(':')[0] }}">{{ event.action }}</td>
        </tr>
        {% endfor %}
    </table>
    <script>
        function exportReport() {
            fetch("/export")
            .then(r => r.json())
            .then(data => {
                alert(data.message + " File: " + data.file);
            });
        }
    </script>
</body>
</html>
</body>
</html>
